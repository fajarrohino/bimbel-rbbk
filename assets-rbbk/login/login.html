<div class="relative w-full max-w-[1200px] mx-auto px-6 py-12 md:py-16 overflow-hidden flex flex-col items-center justify-center min-h-[calc(100vh-160px)]"><div class="absolute -top-32 -left-20 w-96 h-96 bg-primary-fixed-dim/40 rounded-full blur-3xl pointer-events-none -z-10"></div><div class="absolute top-1/2 -right-32 w-80 h-80 bg-secondary-fixed/50 rounded-full blur-3xl pointer-events-none -z-10"></div><div class="w-full max-w-md mx-auto"><div class="text-center space-y-2 mb-8"><h1 class="font-display-hero text-headline-lg text-on-surface tracking-tight font-bold">Masuk ke Rumah Belajar</h1><p class="font-body-md text-body-sm text-on-surface-variant max-w-sm mx-auto leading-relaxed">Masukkan username atau ID Siswa serta password Anda untuk masuk.</p></div><div class="bg-surface-container-lowest p-6 md:p-8 rounded-xl shadow-md border-outline-variant/30 space-y-6"><form class="space-y-4" id="login-form" onsubmit="event.preventDefault(); handleLoginSubmit();"><div class="space-y-1.5"><label class="font-label-md text-label-md text-on-surface font-semibold flex items-center justify-between" for="user-identity"><span class="">Username / ID Siswa</span></label><div class="relative flex items-center"><div class="absolute left-3.5 text-on-surface-variant pointer-events-none flex items-center"><span class="material-symbols-outlined text-[20px]">person</span></div><input class="w-full pl-11 pr-4 py-3 bg-surface-container-lowest text-on-surface rounded-lg font-body-md text-body-md shadow-sm border border-outline-variant/30 focus:outline-none focus:ring-2 focus:ring-primary placeholder:text-on-surface-variant/50 transition-all" id="user-identity" placeholder="Masukkan username atau ID siswa" required="" type="text"></div></div><div class="space-y-1.5"><label class="font-label-md text-label-md text-on-surface font-semibold flex items-center justify-between" for="user-pin"><span class="">Password</span></label><div class="relative flex items-center"><div class="absolute left-3.5 text-on-surface-variant pointer-events-none flex items-center"><span class="material-symbols-outlined text-[20px]">lock</span></div><input class="w-full pl-11 pr-11 py-3 bg-surface-container-lowest text-on-surface rounded-lg font-body-md text-body-md shadow-sm border border-outline-variant/30 focus:outline-none focus:ring-2 focus:ring-primary placeholder:text-on-surface-variant/50 transition-all" id="user-pin" maxlength="32" placeholder="Masukkan password" required="" type="password"><button aria-label="Toggle kata sandi visibility" class="absolute right-3 text-on-surface-variant hover:text-on-surface p-1 rounded transition-colors" onclick="togglePasswordVisibility()" type="button"><span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span></button></div></div><div class="flex items-center justify-between pt-1"><label class="flex items-center gap-2 cursor-pointer select-none"><input checked="" class="w-4 h-4 rounded text-primary focus:ring-primary-fixed border-outline-variant transition cursor-pointer" type="checkbox"><span class="font-body-sm text-body-sm text-on-surface-variant">Ingat perangkat saya</span></label></div><button class="w-full py-3 px-6 rounded-lg bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg shadow-sm hover:shadow transition-all duration-200 flex items-center justify-center gap-2" type="submit"><span class="">Masuk ke Ruang Belajar</span><span class="material-symbols-outlined text-[20px]">login</span></button></form><div class="pt-4 border-outline-variant/20 flex flex-col items-center justify-center gap-2 text-center text-body-sm font-body-sm text-on-surface-variant"><p class="">Belum terdaftar sebagai murid Bu Khotimah? <a class="text-primary font-semibold hover:underline" data-path="daftar-siswa" href="#">Daftar Sekarang</a></p><p class="text-[12px]">Butuh bantuan akun? <a class="text-secondary font-semibold hover:underline inline-flex items-center gap-0.5" href="https://wa.me/" rel="no </div>
<script>
  function switchRole(role) {
    const tabWali = document.getElementById('tab-wali');
    const tabTutor = document.getElementById('tab-tutor');
    const labelIdentity = document.getElementById('label-identity');
    const inputIdentity = document.getElementById('user-identity');

    if (role === 'wali') {
      tabWali.className = 'py-2.5 px-3 rounded font-label-md text-label-md text-on-primary bg-primary shadow-sm flex items-center justify-center gap-2 transition-all';
      tabTutor.className = 'py-2.5 px-3 rounded font-label-md text-label-md text-on-surface-variant hover:text-on-surface bg-transparent flex items-center justify-center gap-2 transition-all';
      if (labelIdentity) {
        labelIdentity.innerHTML = '<span>Nomor WhatsApp Terdaftar</span><span class="font-body-sm text-body-sm text-on-surface-variant font-normal">atau ID Siswa</span>';
      }
      if (inputIdentity) {
        inputIdentity.placeholder = 'Contoh: 08123456789 atau RBBK-2025-01';
      }
    } else {
      tabTutor.className = 'py-2.5 px-3 rounded font-label-md text-label-md text-on-primary bg-primary shadow-sm flex items-center justify-center gap-2 transition-all';
      tabWali.className = 'py-2.5 px-3 rounded font-label-md text-label-md text-on-surface-variant hover:text-on-surface bg-transparent flex items-center justify-center gap-2 transition-all';
      if (labelIdentity) {
        labelIdentity.innerHTML = '<span>NIP / Email Pengajar RBBK</span><span class="font-body-sm text-body-sm text-on-surface-variant font-normal">khusus staf bimbingan</span>';
      }
      if (inputIdentity) {
        inputIdentity.placeholder = 'Contoh: tutor@rbbk.id atau ID-TUTOR';
      }
    }
  }

  function togglePasswordVisibility() {
    const pinInput = document.getElementById('user-pin');
    const eyeIcon = document.getElementById('eye-icon');
    if (!pinInput || !eyeIcon) return;
    
    if (pinInput.type === 'password') {
      pinInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      pinInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleLoginSubmit() {
    const identity = document.getElementById('user-identity')?.value;
    const pin = document.getElementById('user-pin')?.value;
    if (identity && pin) {
      alert('Memproses masuk ke portal untuk: ' + identity);
    }
  }
</script></main><footer class="w-full bg-surface-container-low shadow-[0_-1px_8px_rgba(0,0,0,0.02)] mt-12"></footer>
