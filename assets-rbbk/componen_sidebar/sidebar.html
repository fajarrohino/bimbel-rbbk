<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar &amp; Header - Rumah Belajar Bu Khotimah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-[#f0f4f9] min-h-screen text-slate-800 flex overflow-hidden">

  <!-- ==================== SIDEBAR ==================== -->
  <aside id="sidebar" class="w-72 bg-white border-r border-slate-200/80 min-h-screen flex flex-col justify-between shrink-0 shadow-sm transition-all duration-200 z-30">
    
    <!-- Bagian Atas: Logo & Navigasi -->
    <div class="flex flex-col">
      <!-- Logo Container -->
      <div class="h-24 px-6 flex items-center border-b border-slate-100 gap-3">
        <div class="w-12 h-12 flex items-center justify-center shrink-0">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAgxExgNFirM81ykwz_KGkZdu5Y4CE1z9RIDiFO2xQCRddw4ex6sB1eoYCP1rKua7NflOjocZcYRN5XrozKOt8T5Zv5eRBSgkkHxE0elQiYSa1uOktXk0p16JSLbEnS653uJqr4-0ogbDWew056CoY6xjz4tTOOamfAusgdzgT9BHG8zpGadXlShnyhWNrQuxOxuewt0RDRW8WHqbMNBSWeu005L-BWkaRWZf0dvmCmaJQ0manOhzvIKvEThiVdxO5_ZQ" alt="Logo Rumah Belajar Bu Khotimah" class="max-w-full max-h-full object-contain filter drop-shadow-sm">
        </div>
        <div class="flex flex-col">
          <span class="font-extrabold text-base tracking-tight text-[#0284c7] leading-tight">Rumah Belajar</span>
          <span class="text-xs font-semibold text-slate-500 tracking-wide uppercase">Bu Khotimah</span>
        </div>
      </div>

      <!-- Menu Navigasi -->
      <nav class="px-4 py-6 space-y-1.5 overflow-y-auto max-h-[calc(100vh-170px)]">
        
        <!-- 1. Dashboard -->
        <a href="#dashboard" class="flex items-center gap-3.5 px-4 py-3 rounded-xl font-semibold text-sm text-[#0284c7] bg-[#f0f7ff] border border-[#bae6fd]/50 transition-colors group">
          <svg class="w-5 h-5 text-[#0284c7]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
          </svg>
          <span class="">Dashboard</span>
        </a>

        <!-- 2. Data Siswa -->
        <a href="#data-siswa" class="flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-colors group">
          <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
          <span class="">Data Siswa</span>
        </a>

        <!-- 3. Jadwal Bimbingan (Dropdown) -->
        <div class="relative">
          <button type="button" onclick="toggleJadwalDropdown()" id="btn-jadwal" class="w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium text-sm text-slate-700 hover:text-slate-900 hover:bg-slate-50 transition-colors group">
            <div class="flex items-center gap-3.5">
              <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
              <span class="">Jadwal Bimbingan</span>
            </div>
            <svg id="arrow-jadwal" class="w-4 h-4 text-slate-400 transition-transform duration-200 transform rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>

          <!-- Sub-menu Jadwal Bimbingan -->
          <div id="submenu-jadwal" class="mt-1 pl-10 pr-2 space-y-1 block transition-all duration-200">
            <a href="#jadwal-siswa" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:text-[#0284c7] hover:bg-[#f0f7ff] transition-colors">
              <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
              <span class="">Jadwal Siswa</span>
            </a>
            <a href="#atur-jadwal" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:text-[#0284c7] hover:bg-[#f0f7ff] transition-colors">
              <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
              <span class="">Atur Jadwal</span>
            </a>
          </div>
        </div>

        <!-- 4. Absensi -->
        <a href="#absensi" class="flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-colors group">
          <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
          </svg>
          <span class="">Absensi</span>
        </a>

        <!-- 5. Pembayaran -->
        <a href="#pembayaran" class="flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-colors group">
          <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>
          </svg>
          <span class="">Pembayaran</span>
        </a>

        <!-- 6. Program Belajar -->
        <a href="#program-belajar" class="flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-colors group">
          <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
          <span class="">Program Belajar</span>
        </a>

      </nav>
    </div>

    <!-- Bagian Bawah: Card Info / Bantuan Ringkas -->
    <div class="p-4 border-t border-slate-100">
      
    </div>
  </aside>

  <!-- ==================== MAIN WRAPPER ==================== -->
  <div class="flex-1 flex flex-col min-h-screen overflow-hidden">
    
    <!-- ==================== TOP HEADER ==================== -->
    <header class="h-20 bg-white border-b border-slate-200/80 px-8 flex items-center justify-end z-20 shrink-0">
      
      <!-- Right Action Items: Notifikasi & Profile Dropdown -->
      <div class="flex items-center gap-4">
        
        <!-- 1. Icon Notifikasi -->
        <div class="relative">
          <button type="button" class="w-10 h-10 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200/80 text-slate-600 flex items-center justify-center transition-colors relative" title="Notifikasi">
            <svg class="w-5 h-5 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
            <!-- Red notification dot -->
            <span class="absolute top-2.5 right-2.5 w-2 h-2 bg-rose-500 rounded-full ring-2 ring-white"></span>
          </button>
        </div>

        <!-- 2. Profile Icon & Dropdown -->
        <div class="relative" id="profile-container">
          <button type="button" onclick="toggleProfileDropdown()" id="profile-btn" class="w-10 h-10 rounded-xl bg-sky-50 border border-sky-200/80 text-[#0284c7] hover:bg-sky-100 flex items-center justify-center transition-all focus:outline-none focus:ring-2 focus:ring-[#0284c7]/20" title="Profil Pengguna">
            <!-- Icon Profile -->
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </button>

          <!-- Dropdown Menu Profile & Logout -->
          <div id="profile-dropdown" class="hidden absolute right-0 mt-2.5 w-48 bg-white rounded-2xl shadow-xl border border-slate-100 py-2 z-50 transform transition-all duration-150 origin-top-right">
            <!-- Item 1: Profile -->
            <a href="#profile" class="flex items-center gap-3 px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50 hover:text-[#0284c7] transition-colors">
              <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
              <span class="">Profile</span>
            </a>

            <!-- Divider -->
            <div class="my-1.5 border-t border-slate-100"></div>

            <!-- Item 2: Logout -->
            <a href="#logout" class="flex items-center gap-3 px-4 py-2.5 text-sm font-semibold text-rose-600 hover:bg-rose-50 transition-colors">
              <svg class="w-4 h-4 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
              </svg>
              <span class="">Logout</span>
            </a>
          </div>
        </div>

      </div>
    </header>

    <!-- ==================== CONTENT CANVAS AREA (DEMO PREVIEW) ==================== -->
    <main class="flex-1 p-8 overflow-y-auto">
      <div class="max-w-4xl mx-auto">
        <!-- Showcase Card -->
        
      </div>
    </main>

  </div>

  <!-- JavaScript Interaktif -->
  <script>
    function toggleJadwalDropdown() {
      const submenu = document.getElementById('submenu-jadwal');
      const arrow = document.getElementById('arrow-jadwal');
      if (submenu.classList.contains('hidden')) {
        submenu.classList.remove('hidden');
        arrow.classList.add('rotate-180');
      } else {
        submenu.classList.add('hidden');
        arrow.classList.remove('rotate-180');
      }
    }

    function toggleProfileDropdown() {
      const dropdown = document.getElementById('profile-dropdown');
      dropdown.classList.toggle('hidden');
    }

    // Klik di luar dropdown untuk menutup
    document.addEventListener('click', function(event) {
      const profileContainer = document.getElementById('profile-container');
      const profileDropdown = document.getElementById('profile-dropdown');
      if (profileContainer && !profileContainer.contains(event.target)) {
        profileDropdown.classList.add('hidden');
      }
    });
  </script>







</body></html>
